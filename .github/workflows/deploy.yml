name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz (fail-soft — quarantine broken notes, never abort the whole site)
        shell: bash
        run: |
          set +e -o pipefail
          mkdir -p _quarantine
          : > _quarantine/quarantined.txt
          ok=0
          for attempt in $(seq 1 30); do
            if npx quartz build 2> >(tee /tmp/qz_err.log >&2); then
              ok=1; echo "build ok (attempt $attempt)"; break
            fi
            line="$(grep -oE 'Failed to process (html|markdown|file) `[^`]+`' /tmp/qz_err.log | head -1)"
            bad="$(printf '%s' "$line" | grep -oE '`[^`]+`' | tr -d '`')"
            if [ -z "$bad" ] || [ ! -f "$bad" ]; then
              echo "real failure (no named offending file):"
              tail -40 /tmp/qz_err.log
              exit 1
            fi
            echo "quarantining broken note: $bad"
            mkdir -p "_quarantine/$(dirname "$bad")"
            mv "$bad" "_quarantine/$bad"
            echo "$bad" >> _quarantine/quarantined.txt
          done
          [ "$ok" = 1 ] || { echo "still failing after 30 quarantines"; exit 1; }
          if [ -s _quarantine/quarantined.txt ]; then
            { echo "QUARANTINED<<QEOF"; cat _quarantine/quarantined.txt; echo QEOF; } >> "$GITHUB_ENV"
          fi

      - name: Telegram alert if any note was quarantined
        if: env.QUARANTINED != ''
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then exit 0; fi
          MSG="⚠️ dlonestar.com 배포 성공 — 깨진 노트 격리됨(고쳐주세요):"$'\n'"${QUARANTINED}"
          curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null || true

      - name: Add CNAME for custom domain
        run: echo "dlonestar.com" > public/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  lighthouse:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://dlonestar.com/
          uploadArtifacts: true
          temporaryPublicStorage: true

  # Fires only when build or deploy failed (lighthouse excluded). Bridges
  # the silent-failure gap that hid the 2026-04-28 incident for ~30h.
  notify-failure:
    if: failure() && github.event_name == 'push'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram alert
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram secrets missing — skipping alert" >&2
            exit 0
          fi
          MSG="🚨 dlonestar.com 빌드 실패 | 커밋: ${COMMIT_MSG} | 로그: ${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" >/dev/null
